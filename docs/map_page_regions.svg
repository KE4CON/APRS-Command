<svg viewBox="0 0 1320 812" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .num { fill:#c62828; }
      .numtxt { fill:#ffffff; font-weight:700; font-size:14px; text-anchor:middle; }
      .legnum { fill:#c62828; }
      .legname { fill:#12233a; font-weight:700; font-size:15px; }
      .legdesc { fill:#48566a; font-size:12.5px; }
      .lead { stroke:#c62828; stroke-width:1.5; stroke-dasharray:4 3; fill:none; }
      .mock { font-size:12px; }
    </style>
  </defs>

  <rect x="0" y="0" width="1320" height="812" fill="#eef2f7"/>
  <text x="40" y="36" fill="#12233a" font-size="22" font-weight="700">APRS Command — Map Page Regions</text>
  <text x="40" y="56" fill="#5a687c" font-size="13">Names taken directly from the app layout (MainWindow.axaml). Use these terms in the manual.</text>

  <!-- ===================== MOCK WINDOW ===================== -->
  <g>
    <!-- window frame -->
    <rect x="40" y="76" width="770" height="700" rx="10" fill="#ffffff" stroke="#c3ccd8" stroke-width="1.5"/>

    <!-- 1 Title bar -->
    <rect x="41" y="77" width="768" height="66" rx="9" fill="#1f3350"/>
    <rect x="41" y="120" width="768" height="23" fill="#1f3350"/>
    <text x="60" y="105" fill="#ffffff" font-size="16" font-weight="700">APRS Command</text>
    <text x="60" y="126" fill="#9fb4d0" font-size="11">APRS station map</text>
    <!-- 2 status badges -->
    <rect x="612" y="98" width="98" height="26" rx="4" fill="#2c3f5c" stroke="#5c6f8c"/>
    <text x="661" y="115" fill="#dfe8f5" font-size="11" text-anchor="middle">APRS-IS Offline</text>
    <rect x="718" y="98" width="78" height="26" rx="4" fill="#12403c" stroke="#1f6f66"/>
    <text x="757" y="115" fill="#5fe0cf" font-size="11" text-anchor="middle">TX Disabled</text>

    <!-- 3 Menu bar -->
    <rect x="41" y="143" width="768" height="30" fill="#dde4ee"/>
    <text x="56" y="163" class="mock" fill="#22303f">Settings</text>
    <text x="120" y="163" class="mock" fill="#22303f">View</text>
    <text x="168" y="163" class="mock" fill="#22303f">Map</text>
    <text x="212" y="163" class="mock" fill="#22303f">Messages</text>
    <text x="288" y="163" class="mock" fill="#22303f">Operate</text>
    <text x="352" y="163" class="mock" fill="#22303f">Tools</text>
    <text x="404" y="163" class="mock" fill="#22303f">Help</text>

    <!-- 4 NWS banner (conditional) -->
    <rect x="41" y="173" width="768" height="22" fill="#7c2d12"/>
    <text x="56" y="188" class="mock" fill="#ffe4d6" font-size="11">⚠ Weather alert banner — appears only when an NWS alert is active</text>

    <!-- 5 Draw banner (conditional) -->
    <rect x="41" y="195" width="768" height="22" fill="#1d4ed8"/>
    <text x="56" y="210" class="mock" fill="#ffffff" font-size="11">✏ Draw-mode banner — appears only while a drawing tool is active</text>

    <!-- Main content: sidebar + map -->
    <!-- 6 icon sidebar -->
    <rect x="41" y="217" width="60" height="527" fill="#e7ecf3" stroke="#d4dbe6"/>
    <g fill="#3b4a5e" font-size="20" text-anchor="middle">
      <text x="71" y="245">⌂</text>
      <text x="71" y="278">◎</text>
      <text x="71" y="311">🔍</text>
      <text x="71" y="344">📏</text>
      <text x="71" y="377">🗺</text>
    </g>
    <line x1="55" y1="398" x2="87" y2="398" stroke="#c3ccd8"/>
    <g fill="#3b4a5e" font-size="20" text-anchor="middle">
      <text x="71" y="428">📡</text>
      <text x="71" y="461">🔔</text>
      <text x="71" y="494">⊙</text>
      <text x="71" y="527">🛤</text>
      <text x="71" y="560">🌧</text>
    </g>

    <!-- 7 map area -->
    <rect x="101" y="217" width="708" height="527" fill="#cfe0d4"/>
    <!-- fake map texture -->
    <g stroke="#b6cdba" stroke-width="1" opacity="0.8">
      <path d="M101 300 q120 -30 240 10 t360 -20" fill="none"/>
      <path d="M101 420 q180 40 340 -10 t360 30" fill="none"/>
      <path d="M180 217 l40 527" fill="none"/>
      <path d="M520 217 l-30 527" fill="none"/>
    </g>
    <circle cx="430" cy="470" r="5" fill="#c62828"/>
    <circle cx="560" cy="360" r="5" fill="#1d4ed8"/>
    <circle cx="300" cy="540" r="5" fill="#15803d"/>

    <!-- 8 base map selector (on-map top-left) -->
    <rect x="115" y="231" width="196" height="30" rx="5" fill="#ffffff" stroke="#c3ccd8"/>
    <text x="126" y="250" class="mock" fill="#5a687c" font-size="11">Base map:</text>
    <rect x="182" y="235" width="122" height="22" rx="3" fill="#f1f4f9" stroke="#cdd6e2"/>
    <text x="190" y="250" class="mock" fill="#22303f" font-size="11">OpenStreetMap ▾</text>

    <!-- 11 object placement overlay (top-right, conditional) -->
    <rect x="614" y="231" width="182" height="42" rx="6" fill="#ffffff" stroke="#c3ccd8" opacity="0.96"/>
    <text x="624" y="248" class="mock" fill="#22303f" font-size="10.5">Placing object…</text>
    <text x="624" y="264" class="mock" fill="#5a687c" font-size="9.5">(top-right, only while placing)</text>

    <!-- 9 station details panel (bottom-left, conditional) -->
    <rect x="115" y="560" width="230" height="172" rx="8" fill="#ffffff" stroke="#c3ccd8"/>
    <text x="128" y="582" class="mock" fill="#12233a" font-size="13" font-weight="700">KE4CON-9</text>
    <rect x="288" y="568" width="44" height="20" rx="3" fill="#eef2f7" stroke="#cdd6e2"/>
    <text x="310" y="582" class="mock" fill="#3b4a5e" font-size="10" text-anchor="middle">Clear</text>
    <g fill="#5a687c" font-size="10">
      <text x="128" y="606">Symbol</text><text x="235" y="606" fill="#22303f">Car</text>
      <text x="128" y="626">Grid</text><text x="235" y="626" fill="#22303f">EM73</text>
      <text x="128" y="646">Heard</text><text x="235" y="646" fill="#22303f">2 min ago</text>
      <text x="128" y="666">Speed</text><text x="235" y="666" fill="#22303f">31 mph</text>
    </g>
    <text x="128" y="694" fill="#5a687c" font-size="10">Path / Comment / Last raw packet…</text>

    <!-- 10 radar scrubber (bottom-center, conditional) -->
    <rect x="470" y="694" width="210" height="38" rx="8" fill="#ffffff" stroke="#c3ccd8"/>
    <g fill="#3b4a5e" font-size="14" text-anchor="middle">
      <text x="494" y="718">⏮</text><text x="524" y="718">▶</text><text x="554" y="718">⏭</text>
    </g>
    <text x="616" y="714" class="mock" fill="#22303f" font-size="11" text-anchor="middle">10:45</text>
    <text x="616" y="726" class="mock" fill="#5a687c" font-size="8.5" text-anchor="middle">radar frame</text>

    <!-- 12 status bar -->
    <rect x="41" y="744" width="768" height="31" rx="0" fill="#33465f"/>
    <rect x="41" y="765" width="768" height="10" fill="#33465f"/>
    <text x="58" y="764" class="mock" fill="#cfd8e6" font-size="11">Ready</text>
    <text x="600" y="764" class="mock" fill="#9fb0c6" font-size="11">APRS-IS Disconnected</text>
    <text x="720" y="764" class="mock" fill="#5fe0cf" font-size="11">RF TX Disabled</text>
  </g>

  <!-- ===================== CALLOUT NUMBERS ===================== -->
  <g>
    <!-- 1 title bar -->
    <circle cx="828" cy="105" r="13" class="num"/><text x="828" y="110" class="numtxt">1</text>
    <line x1="815" y1="105" x2="470" y2="108" class="lead"/>
    <!-- 2 badges -->
    <circle cx="828" cy="140" r="13" class="num"/><text x="828" y="145" class="numtxt">2</text>
    <line x1="815" y1="140" x2="710" y2="120" class="lead"/>
    <!-- 3 menu -->
    <circle cx="828" cy="176" r="13" class="num"/><text x="828" y="181" class="numtxt">3</text>
    <line x1="815" y1="176" x2="440" y2="162" class="lead"/>
    <!-- 4 nws -->
    <circle cx="828" cy="212" r="13" class="num"/><text x="828" y="217" class="numtxt">4</text>
    <line x1="815" y1="212" x2="620" y2="185" class="lead"/>
    <!-- 5 draw -->
    <circle cx="828" cy="248" r="13" class="num"/><text x="828" y="253" class="numtxt">5</text>
    <line x1="815" y1="248" x2="640" y2="207" class="lead"/>
    <!-- 6 sidebar -->
    <circle cx="828" cy="300" r="13" class="num"/><text x="828" y="305" class="numtxt">6</text>
    <line x1="815" y1="300" x2="88" y2="330" class="lead"/>
    <!-- 7 map -->
    <circle cx="828" cy="360" r="13" class="num"/><text x="828" y="365" class="numtxt">7</text>
    <line x1="815" y1="360" x2="620" y2="470" class="lead"/>
    <!-- 8 base map -->
    <circle cx="828" cy="420" r="13" class="num"/><text x="828" y="425" class="numtxt">8</text>
    <line x1="815" y1="420" x2="312" y2="246" class="lead"/>
    <!-- 9 station details -->
    <circle cx="828" cy="480" r="13" class="num"/><text x="828" y="485" class="numtxt">9</text>
    <line x1="815" y1="480" x2="345" y2="640" class="lead"/>
    <!-- 10 radar -->
    <circle cx="828" cy="540" r="13" class="num"/><text x="828" y="545" class="numtxt">10</text>
    <line x1="815" y1="540" x2="680" y2="712" class="lead"/>
    <!-- 11 object overlay -->
    <circle cx="828" cy="600" r="13" class="num"/><text x="828" y="605" class="numtxt">11</text>
    <line x1="815" y1="600" x2="796" y2="252" class="lead"/>
    <!-- 12 status bar -->
    <circle cx="828" cy="660" r="13" class="num"/><text x="828" y="665" class="numtxt">12</text>
    <line x1="815" y1="660" x2="470" y2="760" class="lead"/>
  </g>

  <!-- ===================== LEGEND ===================== -->
  <g>
    <rect x="858" y="78" width="428" height="698" rx="10" fill="#ffffff" stroke="#c3ccd8"/>
    <text x="878" y="106" fill="#12233a" font-size="16" font-weight="700">What each region is called</text>

    <!-- entries -->
    <g>
      <circle cx="890" cy="132" r="11" class="legnum"/><text x="890" y="137" class="numtxt">1</text>
      <text x="912" y="130" class="legname">Title bar</text>
      <text x="912" y="148" class="legdesc">Dark strip at the very top: app name + “APRS station map”.</text>
      <text x="912" y="164" class="legdesc" font-weight="700" fill="#c62828">Not the “header.”</text>

      <circle cx="890" cy="188" r="11" class="legnum"/><text x="890" y="193" class="numtxt">2</text>
      <text x="912" y="186" class="legname">Status badges</text>
      <text x="912" y="204" class="legdesc">Right end of the title bar: APRS-IS badge + TX badge.</text>

      <circle cx="890" cy="230" r="11" class="legnum"/><text x="890" y="235" class="numtxt">3</text>
      <text x="912" y="228" class="legname">Menu bar</text>
      <text x="912" y="246" class="legdesc">Settings · View · Map · Messages · Operate · Tools · Help.</text>

      <circle cx="890" cy="272" r="11" class="legnum"/><text x="890" y="277" class="numtxt">4</text>
      <text x="912" y="270" class="legname">Weather-alert banner</text>
      <text x="912" y="288" class="legdesc">Appears only when an NWS alert is active (click to open).</text>

      <circle cx="890" cy="314" r="11" class="legnum"/><text x="890" y="319" class="numtxt">5</text>
      <text x="912" y="312" class="legname">Draw-mode banner</text>
      <text x="912" y="330" class="legdesc">Appears only while a drawing tool is active.</text>

      <circle cx="890" cy="356" r="11" class="legnum"/><text x="890" y="361" class="numtxt">6</text>
      <text x="912" y="354" class="legname">Icon sidebar</text>
      <text x="912" y="372" class="legdesc">Vertical toolbar of icon buttons down the left edge.</text>

      <circle cx="890" cy="398" r="11" class="legnum"/><text x="890" y="403" class="numtxt">7</text>
      <text x="912" y="396" class="legname">Map area</text>
      <text x="912" y="414" class="legdesc">The map itself — the main canvas that fills the window.</text>

      <circle cx="890" cy="440" r="11" class="legnum"/><text x="890" y="445" class="numtxt">8</text>
      <text x="912" y="438" class="legname">Base-map selector</text>
      <text x="912" y="456" class="legdesc">On-map dropdown, top-left: OpenStreetMap / USGS Topo / …</text>

      <circle cx="890" cy="482" r="11" class="legnum"/><text x="890" y="487" class="numtxt">9</text>
      <text x="912" y="480" class="legname">Station-details panel</text>
      <text x="912" y="498" class="legdesc">On-map, bottom-left; appears when you click a station.</text>

      <circle cx="890" cy="524" r="11" class="legnum"/><text x="890" y="529" class="numtxt">10</text>
      <text x="912" y="522" class="legname">Radar scrubber</text>
      <text x="912" y="540" class="legdesc">On-map, bottom-center; appears when weather radar is on.</text>

      <circle cx="890" cy="566" r="11" class="legnum"/><text x="890" y="571" class="numtxt">11</text>
      <text x="912" y="564" class="legname">Object-placement overlay</text>
      <text x="912" y="582" class="legdesc">On-map, top-right; appears while placing an object.</text>

      <circle cx="890" cy="608" r="11" class="legnum"/><text x="890" y="613" class="numtxt">12</text>
      <text x="912" y="606" class="legname">Status bar</text>
      <text x="912" y="624" class="legdesc">Bottom strip: Ready · APRS-IS status · RF TX status.</text>
    </g>

    <!-- note box -->
    <rect x="878" y="648" width="388" height="108" rx="8" fill="#fff5f5" stroke="#f0c0c0"/>
    <text x="894" y="672" fill="#c62828" font-size="13" font-weight="700">Header vs. title bar</text>
    <text x="894" y="694" class="legdesc">“Header” isn’t a region name here. The dark top strip is the</text>
    <text x="894" y="710" class="legdesc"><tspan font-weight="700" fill="#12233a">title bar</tspan> (1). Inside individual panels/windows, the</text>
    <text x="894" y="726" class="legdesc">colored top strip with the grip + ✕ is also a <tspan font-weight="700" fill="#12233a">title bar</tspan>.</text>
    <text x="894" y="746" class="legdesc">Sort/column strips inside a list are “<tspan font-weight="700" fill="#12233a">column headers</tspan>.”</text>
  </g>
</svg>
